<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biodata Ahnaf</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(to right, #0f2027, #203a43, #2c5364);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: #ffffff;
    }

    .card {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 30px 40px;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    h1 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 20px;
      color: #00ffe7;
    }

    .info {
      margin: 15px 0;
      font-size: 18px;
    }

    .label {
      font-weight: bold;
      color: #00ffd5;
      display: inline-block;
      min-width: 120px;
    }

    .footer {
      margin-top: 25px;
      font-style: italic;
      text-align: center;
      color: #bbbbbb;
    }

    @media (max-width: 600px) {
      .card {
        padding: 25px;
      }

      .label {
        min-width: 100px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>✨ BIODATA AHNAF ✨</h1>
    <div class="info"><span class="label">👤 Nama:</span> Ahnaf Adib Yunan</div>
    <div class="info"><span class="label">🏫 Kelas:</span> 9E - 1</div>
    <div class="info"><span class="label">🎯 Hobi:</span> Ngoding, Desain, Membaca</div>
    <div class="info"><span class="label">🚀 Cita-cita:</span> Software Engineer</div>
    <div class="info"><span class="label">💬 Motto:</span> "Belajar hari ini, panen esok hari."</div>
    <div class="footer">Terus semangat mengejar mimpi! 🚀</div>
  </div>
</body>
</html>
